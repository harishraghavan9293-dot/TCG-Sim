<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TCG Simulator</title>
    <style>
        :root {
            --bg-color: #f4f1ea;
            --container-bg: #fffdf9;
            --text-color: #2c221e;
            --accent-color: #8b4513;
            --accent-hover: #a0522d;
            --border-color: #d3c5b4;
            --shadow: 0 4px 12px rgba(44, 34, 30, 0.08);
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        header {
            background-color: var(--container-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem;
            text-align: center;
        }

        h1 {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--accent-color);
        }

        .subtitle {
            font-size: 0.85rem;
            color: #666;
            margin-top: 0.2rem;
        }

        /* Top Configuration Panel */
        .config-panel {
            background: var(--container-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 0.75rem 1rem;
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: center;
            justify-content: center;
        }

        .config-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #5c4b43;
        }

        select, button {
            padding: 0.5rem 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.9rem;
            background: #fff;
            color: var(--text-color);
        }

        button {
            background-color: var(--accent-color);
            color: white;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        /* Navigation Tabs */
        .tabs-nav {
            display: flex;
            justify-content: center;
            background: var(--border-color);
            gap: 2px;
            border-bottom: 1px solid var(--border-color);
        }

        .tab-btn {
            background: #e8dfd1;
            border: none;
            padding: 0.75rem 1.5rem;
            font-weight: 600;
            cursor: pointer;
            flex: 1;
            max-width: 200px;
            text-align: center;
            color: #5c4b43;
            border-radius: 0;
        }

        .tab-btn.active {
            background: var(--container-bg);
            color: var(--accent-color);
            border-bottom: 3px solid var(--accent-color);
        }

        /* Main Workspace Container */
        .workspace {
            flex: 1;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            padding: 1.5rem;
            display: none;
            flex-direction: column;
            gap: 1rem;
        }

        .workspace.active {
            display: flex;
        }

        /* Card Grid Architecture (Pack & Binder) */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 1rem;
            justify-content: center;
        }

        .card-slot {
            aspect-ratio: 2.5 / 3.5;
            background: #e2d9c8;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            transition: transform 0.2s;
        }

        .card-slot:hover {
            transform: translateY(-3px);
        }

        .card-slot img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-number-badge {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            font-size: 0.75rem;
            text-align: center;
            padding: 0.25rem;
            font-family: monospace;
            font-weight: bold;
        }

        .card-slot.unowned {
            filter: grayscale(100%) opacity(0.4);
        }

        /* Set Tracker View Styles */
        .tracker-container {
            background: var(--container-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 1.5rem;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .tracker-stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1rem;
        }

        .stat-card {
            background: #f9f6f0;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .stat-card h4 {
            font-size: 0.9rem;
            color: var(--accent-color);
        }

        .stat-card p {
            font-size: 1.1rem;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            .config-panel {
                flex-direction: column;
                align-items: stretch;
            }
            .config-group {
                flex-direction: column;
                align-items: stretch;
            }
            .card-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 0.5rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>TCG sim</h1>
        <div class="subtitle"></div>
    </header>

    <!-- Top Configuration Bar -->
    <div class="config-panel">
        <div class="config-group">
            <label for="franchise-select">Franchise:</label>
            <select id="franchise-select" onchange="handleFranchiseChange()">
                <option value="">Select Franchise</option>
            </select>
        </div>
        <div class="config-group">
            <label for="set-select">Set:</label>
            <select id="set-select" onchange="handleSetChange()">
                <option value="">Select Set</option>
            </select>
        </div>
        <button onclick="refreshMasterData()">🔄 Refresh</button>
        <span id="status-badge" style="font-size: 0.8rem; font-style: italic; color: #666;">Ready</span>
    </div>

    <!-- Navigation Tabs -->
    <div class="tabs-nav">
        <button class="tab-btn active" onclick="switchTab('packer')">📦 Pack Opener</button>
        <button class="tab-btn" onclick="switchTab('binder')">📖 Journal</button>
        <button class="tab-btn" onclick="switchTab('tracker')">📊 Set Tracker</button>
    </div>

    <!-- Tab 1: Pack Opener Workspace -->
    <div id="packer-workspace" class="workspace active">
        <div style="background:var(--container-bg); border:1px solid var(--border-color); border-radius:8px; padding:1.25rem;">
            <h2>Pack Opener</h2>
            <p style="font-size: 0.85rem; color:#666; margin-bottom: 1rem;"></p>
            <button onclick="openPack()">✨ Open Pack</button>
        </div>
        <div class="card-grid" id="pack-stage">
            <div style="grid-column: 1/-1; text-align:center; padding: 3rem; color: #7c6b61;">No pack opened yet.</div>
        </div>
    </div>

    <!-- Tab 2: Journal Binder Workspace -->
    <div id="binder-workspace" class="workspace">
        <div style="background:var(--container-bg); border:1px solid var(--border-color); border-radius:8px; padding:1.25rem; display:flex; justify-content:space-between; align-items:center;">
            <h2>Journal</h2>
            <span id="binder-counter" style="font-size: 0.9rem; font-weight:600;">0 / 0 Owned</span>
        </div>
        <div class="card-grid" id="binder-grid"></div>
    </div>

    <!-- Tab 3: Set Tracker Workspace -->
    <div id="tracker-workspace" class="workspace">
        <div class="tracker-container">
            <h2>Set Analytics</h2>
            <div class="tracker-stats-grid" id="tracker-stats">
                <div class="stat-card">
                    <h4>Overall Set Completion</h4>
                    <p id="stat-total-progress">0 / 0 (0%)</p>
                </div>
            </div>
            <div id="breakdown-details" style="display: flex; flex-direction: column; gap: 1rem;"></div>
        </div>
    </div>

    <script>
        let masterData = [];
        let inventory = JSON.parse(localStorage.getItem('tcg_local_inventory') || '{}');

        // IndexedDB Local Caching Framework
        const dbName = "TCGFieldJournalDB";
        const storeName = "masterMetadata";

        function openIDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(dbName, 1);
                request.onerror = () => reject(request.error);
                request.onsuccess = () => resolve(request.result);
                request.onupgradeneeded = (event) => {
                    const db = event.target.result;
                    if (!db.objectStoreNames.contains(storeName)) {
                        db.createObjectStore(storeName);
                    }
                };
            });
        }

        async function saveMasterDataToIDB(data) {
            const db = await openIDB();
            const tx = db.transaction(storeName, "readwrite");
            tx.objectStore(storeName).put(data, "currentMasterData");
            return tx.complete;
        }

        async function loadMasterDataFromIDB() {
            const db = await openIDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(storeName, "readonly");
                const request = tx.objectStore(storeName).get("currentMasterData");
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        window.onload = async () => {
            updateStatus("Loading local cache...");
            try {
                const cachedData = await loadMasterDataFromIDB();
                if (cachedData && cachedData.length > 0) {
                    masterData = cachedData;
                    populateFranchises();
                    updateStatus("Loaded from local cache instantly!");
                } else {
                    await refreshMasterData();
                }
            } catch (err) {
                console.error("Cache load error:", err);
                await refreshMasterData();
            }
        };

        async function refreshMasterData() {
            updateStatus("Fetching all 39 files from GitHub...");
            try {
                const fileNames = [
                    "alpha_clash.json",
                    "argent_saga_tcg.json",
                    "bakugan_tcg.json",
                    "battle_spirits_saga.json",
                    "cardfight_vanguard.json",
                    "cookierun_braverse_tcg.json",
                    "cyberpunk_tcg.json",
                    "digimon.json",
                    "dragon_ball_z.json",
                    "elestrals.json",
                    "exodus_tcg.json",
                    "final_fantasy_tcg.json",
                    "flesh__blood.json",
                    "force_of_will.json",
                    "future_card_buddyfight.json",
                    "grand_archive.json",
                    "gundam.json",
                    "harry_potter.json",
                    "heroclix.json",
                    "hololive.json",
                    "kryptik___alternative.json",
                    "lightseekers_tcg.json",
                    "lorcana.json",
                    "marvel.json",
                    "metax_tcg.json",
                    "metazoo_keepers.json",
                    "munchkin_ccg.json",
                    "onepiece.json",
                    "palworld.json",
                    "riftbound.json",
                    "shadowverse_evolve.json",
                    "sorcery.json",
                    "star_wars_unlimited.json",
                    "transformers_tcg.json",
                    "union_arena.json",
                    "universus.json",
                    "weiss___schwarz.json",
                    "wixoss.json",
                    "zombie_world_order_tcg.json"
                ];

                const baseUrl = "https://raw.githubusercontent.com/harishraghavan9293-dot/TCG-Sim/refs/heads/main/";

                const filePromises = fileNames.map(fileName => 
                    fetch(baseUrl + fileName).then(res => {
                        if (!res.ok) throw new Error(`Failed to load ${fileName}`);
                        return res.json();
                    }).then(data => data.rows || [])
                );

                const allDatasets = await Promise.all(filePromises);
                masterData = allDatasets.flat();
                
                await saveMasterDataToIDB(masterData);
                populateFranchises();
                updateStatus("Successfully loaded all datasets from GitHub!");
            } catch (err) {
                console.error("GitHub fetch failed:", err);
                updateStatus("Fetch failed. Check connection or filename spelling.");
            }
        }

        function populateFranchises() {
            const franchiseSelect = document.getElementById('franchise-select');
            const franchises = [...new Set(masterData.map(item => item.franchise))].filter(Boolean);
            
            franchiseSelect.innerHTML = '<option value="">-- Select Franchise --</option>';
            franchises.forEach(f => {
                const opt = document.createElement('option');
                opt.value = f;
                opt.textContent = f;
                franchiseSelect.appendChild(opt);
            });
        }

        function handleFranchiseChange() {
            const selectedFranchise = document.getElementById('franchise-select').value;
            const setSelect = document.getElementById('set-select');
            
            setSelect.innerHTML = '<option value="">-- Select Set --</option>';
            if (!selectedFranchise) return;

            const sets = [...new Set(masterData.filter(i => i.franchise === selectedFranchise).map(i => i.setName))].filter(Boolean);
            sets.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s;
                opt.textContent = s;
                setSelect.appendChild(opt);
            });
        }

        function handleSetChange() {
            renderBinder();
            renderTracker();
        }

        function switchTab(tabId) {
            document.querySelectorAll('.workspace').forEach(w => w.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

            if (tabId === 'packer') {
                document.getElementById('packer-workspace').classList.add('active');
                event.target.classList.add('active');
            } else if (tabId === 'binder') {
                document.getElementById('binder-workspace').classList.add('active');
                event.target.classList.add('active');
                renderBinder();
            } else if (tabId === 'tracker') {
                document.getElementById('tracker-workspace').classList.add('active');
                event.target.classList.add('active');
                renderTracker();
            }
        }

        function openPack() {
            const selectedSet = document.getElementById('set-select').value;
            const stage = document.getElementById('pack-stage');
            
            if (!selectedSet) {
                alert("Please select a franchise and a set first!");
                return;
            }

            const availableCards = masterData.filter(i => i.setName === selectedSet);
            if (availableCards.length === 0) {
                alert("No cards found for this set.");
                return;
            }

            stage.innerHTML = '';
            const packResults = [];

            for (let i = 0; i < 10; i++) {
                const card = availableCards[Math.floor(Math.random() * availableCards.length)];
                packResults.push(card);

                const key = `${card.cardNumber}_${card.finish || 'Normal'}`;
                inventory[key] = (inventory[key] || 0) + 1;

                const slot = document.createElement('div');
                slot.className = 'card-slot';
                slot.innerHTML = `
                    <img src="${card.imageUrl || ''}" alt="Card" loading="lazy" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'100\' height=\'140\'><rect width=\'100%\' height=\'100%\' fill=\'#ddd\'/><text x=\'50%\' y=\'50%\' dominant-baseline=\'middle\' text-anchor=\'middle\' font-size=\'10\' fill=\'#666\'>No Image</text></svg>'">
                    <div class="card-number-badge">${card.cardNumber}</div>
                `;
                stage.appendChild(slot);
            }

            localStorage.setItem('tcg_local_inventory', JSON.stringify(inventory));
        }

        function renderBinder() {
            const selectedSet = document.getElementById('set-select').value;
            const grid = document.getElementById('binder-grid');
            grid.innerHTML = '';

            if (!selectedSet) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align:center; padding: 3rem; color: #7c6b61;">Select a set to view your binder inventory.</div>';
                document.getElementById('binder-counter').textContent = `0 / 0 Owned`;
                return;
            }

            const setCards = masterData.filter(i => i.setName === selectedSet);
            let ownedCount = 0;

            setCards.forEach(card => {
                const key = `${card.cardNumber}_${card.finish || 'Normal'}`;
                const isOwned = (inventory[key] || 0) > 0;
                if (isOwned) ownedCount++;

                const slot = document.createElement('div');
                slot.className = `card-slot ${isOwned ? '' : 'unowned'}`;
                slot.innerHTML = `
                    <img src="${card.imageUrl || ''}" alt="Card" loading="lazy" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'100\' height=\'140\'><rect width=\'100%\' height=\'100%\' fill=\'#ddd\'/><text x=\'50%\' y=\'50%\' dominant-baseline=\'middle\' text-anchor=\'middle\' font-size=\'10\' fill=\'#666\'>No Image</text></svg>'">
                    <div class="card-number-badge">${card.cardNumber}</div>
                `;
                grid.appendChild(slot);
            });

            document.getElementById('binder-counter').textContent = `${ownedCount} / ${setCards.length} Unique Cards Owned`;
        }

        function renderTracker() {
            const selectedSet = document.getElementById('set-select').value;
            const statsContainer = document.getElementById('tracker-stats');
            const breakdownContainer = document.getElementById('breakdown-details');
            
            statsContainer.innerHTML = '';
            breakdownContainer.innerHTML = '';

            if (!selectedSet) {
                statsContainer.innerHTML = '<div class="stat-card"><h4>Select a set</h4><p>-</p></div>';
                return;
            }

            const setCards = masterData.filter(i => i.setName === selectedSet);
            let totalCards = setCards.length;
            let totalOwned = 0;

            setCards.forEach(card => {
                const key = `${card.cardNumber}_${card.finish || 'Normal'}`;
                if ((inventory[key] || 0) > 0) totalOwned++;
            });

            const overallPct = totalCards > 0 ? ((totalOwned / totalCards) * 100).toFixed(1) : 0;
            statsContainer.innerHTML = `
                <div class="stat-card">
                    <h4>Overall Set Completion</h4>
                    <p>${totalOwned} / ${totalCards} (${overallPct}%)</p>
                </div>
            `;

            // Finish breakdown calculation
            const finishMap = {};
            setCards.forEach(card => {
                const finish = card.finish || 'Normal';
                if (!finishMap[finish]) finishMap[finish] = { total: 0, owned: 0 };
                finishMap[finish].total++;
                const key = `${card.cardNumber}_${finish}`;
                if ((inventory[key] || 0) > 0) finishMap[finish].owned++;
            });

            let finishHtml = '<h3>Finish Breakdown</h3><div class="tracker-stats-grid">';
            for (const [finish, data] of Object.entries(finishMap)) {
                const pct = data.total > 0 ? ((data.owned / data.total) * 100).toFixed(1) : 0;
                finishHtml += `
                    <div class="stat-card">
                        <h4>${finish} Finish</h4>
                        <p>${data.owned} / ${data.total} (${pct}%)</p>
                    </div>
                `;
            }
            finishHtml += '</div>';

            // Rarity breakdown calculation
            const rarityMap = {};
            setCards.forEach(card => {
                const rarity = card.rarity || 'Common';
                if (!rarityMap[rarity]) rarityMap[rarity] = { total: 0, owned:0 };
                rarityMap[rarity].total++;
                const key = `${card.cardNumber}_${card.finish || 'Normal'}`;
                if ((inventory[key] || 0) > 0) rarityMap[rarity].owned++;
            });

            let rarityHtml = '<h3 style="margin-top:1rem;">Rarity Breakdown</h3><div class="tracker-stats-grid">';
            for (const [rarity, data] of Object.entries(rarityMap)) {
                const pct = data.total > 0 ? ((data.owned / data.total) * 100).toFixed(1) : 0;
                rarityHtml += `
                    <div class="stat-card">
                        <h4>${rarity}</h4>
                        <p>${data.owned} / ${data.total} (${pct}%)</p>
                    </div>
                `;
            }
            rarityHtml += '</div>';

            breakdownContainer.innerHTML = finishHtml + rarityHtml;
        }

        function updateStatus(text) {
            document.getElementById('status-badge').textContent = text;
        }
    </script>
</body>
</html>
