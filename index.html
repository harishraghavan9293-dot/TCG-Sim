<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TCG Field Journal & Pack Simulator</title>
    <style>
        :root {
            --bg-color: #f4f1ea;
            --container-bg: #fffdf9;
            --text-color: #2c221e;
            --accent-color: #8b4513;
            --accent-hover: #a0522d;
            --border-color: #d3c5b4;
            --shadow: 0 4px 12px rgba(44, 34, 30, 0.08);
            --radius: 12px;
            --header-height: 60px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* App Header */
        header {
            height: var(--header-height);
            background-color: var(--container-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        h1 {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent-color);
        }

        /* Responsive App Layout Grid */
        .app-container {
            display: grid;
            grid-template-columns: 280px 1fr;
            flex: 1;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            gap: 1.5rem;
            padding: 1.5rem;
        }

        /* Sidebar Controls */
        sidebar {
            background: var(--container-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 1.25rem;
            height: fit-content;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        /* Main Stage Area */
        main {
            background: var(--container-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 1.5rem;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            min-height: 70vh;
        }

        /* Form Controls & Inputs */
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #5c4b43;
        }

        select, input, button {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            background: #fff;
            color: var(--text-color);
        }

        select:focus, input:focus {
            outline: 2px solid var(--accent-color);
            border-color: transparent;
        }

        button {
            background-color: var(--accent-color);
            color: white;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: background 0.2s ease;
            min-height: 44px; /* Touch-friendly size */
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        /* Status & Sync Notification Box */
        .sync-status {
            font-size: 0.8rem;
            padding: 0.5rem;
            border-radius: 6px;
            background: #f0ebe1;
            text-align: center;
        }

        /* Dynamic Card Reveal Grid */
        .pack-opening-stage {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 1rem;
            justify-content: center;
            align-content: center;
            flex: 1;
        }

        .card-slot {
            aspect-ratio: 2.5 / 3.5;
            background: #eae2d0;
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 0.85rem;
            padding: 0.5rem;
            color: #7c6b61;
            position: relative;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .card-slot img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 6px;
        }

        /* --- RESPONSIVE MEDIA QUERIES --- */

        /* Tablet Layout adjustments */
        @media (max-width: 1024px) {
            .app-container {
                grid-template-columns: 240px 1fr;
                padding: 1rem;
                gap: 1rem;
            }
        }

        /* Mobile Layout adjustments (Stacked) */
        @media (max-width: 768px) {
            body {
                background-color: var(--container-bg);
            }

            header {
                padding: 0 0.75rem;
            }

            .app-container {
                grid-template-columns: 1fr;
                padding: 0.75rem;
                gap: 1rem;
            }

            sidebar {
                box-shadow: none;
                border: none;
                background: #f9f6f0;
            }

            main {
                border: none;
                box-shadow: none;
                padding: 0.5rem;
            }

            .pack-opening-stage {
                grid-template-columns: repeat(2, 1fr);
                gap: 0.75rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>TCG Field Journal</h1>
        <div id="connection-badge" style="font-size: 0.8rem; color: #666;">Ready</div>
    </header>

    <div class="app-container">
        <!-- Sidebar Navigation & Controls -->
        <sidebar>
            <div class="control-group">
                <label for="script-url">Apps Script Endpoint</label>
                <input type="text" id="script-url" placeholder="https://script.google.com/..." />
                <button onclick="saveScriptUrl()">Save & Sync</button>
            </div>

            <hr style="border:0; border-top:1px solid var(--border-color);">

            <div class="control-group">
                <label for="franchise-select">Select Franchise</label>
                <select id="franchise-select" onchange="handleFranchiseChange()">
                    <option value="">-- Choose Franchise --</option>
                </select>
            </div>

            <div class="control-group">
                <label for="set-select">Select Expansion Set</label>
                <select id="set-select">
                    <option value="">-- Choose Set --</option>
                </select>
            </div>

            <button onclick="openPack()" style="margin-top: 0.5rem;">Open Booster Pack</button>
            
            <div class="sync-status" id="sync-status-box">
                Queue: 0 pending syncs
            </div>
        </sidebar>

        <!-- Main Display / Pack Simulation Workspace -->
        <main>
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h2 id="workspace-title" style="font-size: 1.1rem;">Pack Simulator Workspace</h2>
                <span id="card-count-badge" style="font-size: 0.85rem; color: #666;">0 Cards Loaded</span>
            </div>
            
            <div class="pack-opening-stage" id="pack-stage">
                <div class="card-slot">Select a set & open a pack to view pulls!</div>
                <div class="card-slot">Card Slot 2</div>
                <div class="card-slot">Card Slot 3</div>
                <div class="card-slot">Card Slot 4</div>
            </div>
        </main>
    </div>

    <script>
        // Core application state
        let scriptUrl = localStorage.getItem('gs_script_url') || '';
        let masterData = [];
        let pullQueue = JSON.parse(localStorage.getItem('tcg_pull_queue') || '[]');

        document.getElementById('script-url').value = scriptUrl;

        // --- IndexedDB Configuration ---
        const dbName = "TCGFieldJournalDB";
        const storeName = "masterMetadata";

        function openIDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(dbName, 1);
                request.onerror = () => reject(request.error);
                request.onsuccess = () => resolve(request.result);
                request.onupgradeneeded = (event) => {
                    const db = event.target.result;
                    if (!db.objectStoreNames.contains(storeName)) {
                        db.createObjectStore(storeName);
                    }
                };
            });
        }

        async function saveMasterDataToIDB(data) {
            const db = await openIDB();
            const tx = db.transaction(storeName, "readwrite");
            tx.objectStore(storeName).put(data, "currentMasterData");
            return tx.complete;
        }

        async function loadMasterDataFromIDB() {
            const db = await openIDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(storeName, "readonly");
                const request = tx.objectStore(storeName).get("currentMasterData");
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        // --- Initialization & Setup ---
        window.onload = async () => {
            try {
                const cachedData = await loadMasterDataFromIDB();
                if (cachedData) {
                    masterData = cachedData;
                    populateFranchises();
                    updateStatus("Loaded from local cache");
                }
                if (scriptUrl) {
                    refreshMasterDataCache();
                }
            } catch (err) {
                console.error("Initialization error:", err);
            }
            updateQueueUI();
        };

        function saveScriptUrl() {
            scriptUrl = document.getElementById('script-url').value.trim();
            localStorage.setItem('gs_script_url', scriptUrl);
            refreshMasterDataCache();
        }

        async function refreshMasterDataCache() {
            if (!scriptUrl) return;
            updateStatus("Syncing master data...");
            try {
                const targetUrl = `${scriptUrl}?action=getMasterData&t=${Date.now()}`;
                const response = await fetch(targetUrl, { redirect: 'follow' });
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                
                const data = await response.json();
                masterData = data;
                await saveMasterDataToIDB(data);
                
                populateFranchises();
                updateStatus("Master data synchronized!");
            } catch (err) {
                console.error("Sync failed:", err);
                updateStatus("Sync failed (using local cache)");
            }
        }

        function populateFranchises() {
            const franchiseSelect = document.getElementById('franchise-select');
            const franchises = [...new Set(masterData.map(item => item.franchise))];
            
            franchiseSelect.innerHTML = '<option value="">-- Choose Franchise --</option>';
            franchises.forEach(f => {
                const opt = document.createElement('option');
                opt.value = f;
                opt.textContent = f;
                franchiseSelect.appendChild(opt);
            });
            document.getElementById('card-count-badge').textContent = `${masterData.length} Cards Loaded`;
        }

        function handleFranchiseChange() {
            const selectedFranchise = document.getElementById('franchise-select').value;
            const setSelect = document.getElementById('set-select');
            
            setSelect.innerHTML = '<option value="">-- Choose Set --</option>';
            if (!selectedFranchise) return;

            const sets = [...new Set(masterData.filter(i => i.franchise === selectedFranchise).map(i => i.setName))];
            sets.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s;
                opt.textContent = s;
                setSelect.appendChild(opt);
            });
        }

        function openPack() {
            const selectedSet = document.getElementById('set-select').value;
            const stage = document.getElementById('pack-stage');
            
            if (!selectedSet) {
                alert("Please select a franchise and a set first!");
                return;
            }

            const availableCards = masterData.filter(i => i.setName === selectedSet);
            stage.innerHTML = '';
            
            // Simulate opening a 4-card pack layout
            const packResults = [];
            for (let i = 0; i < 4; i++) {
                const randomCard = availableCards[Math.floor(Math.random() * availableCards.length)] || { name: "Common Card" };
                packResults.push(randomCard);

                const slot = document.createElement('div');
                slot.className = 'card-slot';
                slot.innerHTML = `<span>${randomCard.name || "Card"}</span>`;
                stage.appendChild(slot);
            }

            // Push to offline-ready sync queue
            queuePulls(packResults);
        }

        function queuePulls(pulls) {
            pullQueue.push({ timestamp: Date.now(), pulls });
            localStorage.setItem('tcg_pull_queue', JSON.stringify(pullQueue));
            updateQueueUI();
            syncPullQueueBatch();
        }

        async function syncPullQueueBatch() {
            if (pullQueue.length === 0 || !scriptUrl) return;
            const batchToSend = pullQueue[0];

            try {
                await fetch(scriptUrl, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'recordPulls', pulls: batchToSend })
                });
                
                // Assume success under no-cors opaque response constraints, pop queue item
                pullQueue.shift();
                localStorage.setItem('tcg_pull_queue', JSON.stringify(pullQueue));
                updateQueueUI();
            } catch (err) {
                console.warn("Background sync deferred due to network limitation.");
            }
        }

        function updateQueueUI() {
            document.getElementById('sync-status-box').textContent = `Queue: ${pullQueue.length} pending syncs`;
        }

        function updateStatus(text) {
            document.getElementById('connection-badge').textContent = text;
        }
    </script>
</body>
</html>
